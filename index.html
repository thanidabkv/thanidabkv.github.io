<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanida Boonkangvan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400;1,700&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
/* Layout: a single standalone title card, like the first frame of a fragrance film.
   Name centered-left, one line of description, one button. The button pours a celadon glaze up the screen into the portfolio. */
:root{
  --night:#0B100E;
  --paper:#EDEFEA;
  --mist:#9AA8A1;
  --celadon:#3D6A58;
  --glaze:#A9C6B6;
  --display:"EB Garamond","Adobe Garamond Pro",Garamond,Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--glaze);outline-offset:4px}

.stage{position:relative;height:100%;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(clamp(16px,5vw,72px), env(safe-area-inset-left,0px));padding-right:max(clamp(16px,5vw,72px), env(safe-area-inset-right,0px));
  padding-block:clamp(20px,3vw,36px)}

/* Ambient glaze: a soft light that drifts toward the cursor */
.glow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.glow::before{content:"";position:absolute;width:70vmax;height:70vmax;left:var(--gx,60%);top:var(--gy,55%);transform:translate(-50%,-50%);
  background:radial-gradient(circle, color-mix(in srgb,var(--celadon) 38%,transparent) 0%, transparent 62%);
  filter:blur(20px);transition:left 1.6s cubic-bezier(.2,.7,.2,1), top 1.6s cubic-bezier(.2,.7,.2,1)}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

.top,.bottom{position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.mono{font-family:var(--mono);font-weight:500;font-size:.88rem;letter-spacing:.02em;color:var(--mist)}
.links{display:flex;gap:20px}
.links a{text-decoration:none;transition:color .2s}
.links a:hover{color:var(--paper)}

.center{position:relative;align-self:center;display:grid;gap:clamp(20px,3vw,32px);max-width:1200px}
.name{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(3rem,min(12.5vw,19vh),11rem);line-height:.9;letter-spacing:-.015em}
.name .l1,.name .l2{display:block;overflow:hidden;padding-bottom:.08em}
/* room for the italic g's descender, without pushing the lines apart */
.name .l2{padding-bottom:.28em;margin-bottom:-.2em}
.name .l2{font-style:italic;font-weight:400;padding-left:clamp(0px,8vw,140px);color:var(--glaze)}
.ch{display:inline-block;transform:translateY(105%);animation:up 1.1s cubic-bezier(.2,.75,.15,1) forwards;animation-delay:calc(var(--i) * 38ms + 150ms)}
@keyframes up{to{transform:none}}
.desc{margin:0;max-width:44ch;font-family:var(--display);font-style:italic;font-size:clamp(1.25rem,2.2vw,1.75rem);line-height:1.35;color:color-mix(in srgb,var(--paper) 85%,transparent);
  padding-left:clamp(0px,8vw,140px);opacity:0;animation:fade 1s .9s ease forwards}
.role{display:block;font-family:var(--body);font-style:normal;font-weight:500;font-size:.95rem;letter-spacing:.02em;white-space:nowrap;color:var(--mist);margin-bottom:10px}
@keyframes fade{to{opacity:1}}

.enter{justify-self:start;margin-left:clamp(0px,8vw,140px);position:relative;display:inline-flex;align-items:center;gap:14px;
  padding:16px 26px 16px 28px;border:1px solid color-mix(in srgb,var(--paper) 45%,transparent);border-radius:999px;background:none;color:var(--paper);
  font:500 .95rem var(--body);letter-spacing:.02em;cursor:pointer;overflow:hidden;isolation:isolate;opacity:0;animation:fade 1s 1.15s ease forwards}
.enter::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glaze);transform:translateY(101%);border-radius:inherit;transition:transform .5s cubic-bezier(.2,.75,.15,1)}
.enter:hover::before,.enter:focus-visible::before{transform:none}
.enter:hover,.enter:focus-visible{color:var(--night);border-color:var(--glaze)}
.enter .arrow{display:inline-block;transition:transform .5s cubic-bezier(.2,.75,.15,1)}
.enter:hover .arrow{transform:translateX(5px)}

/* The transition: name lifts away, then two glaze layers pour up the screen */
.pour{position:fixed;inset:0;pointer-events:none;z-index:20}
.pour i{position:absolute;inset:0;clip-path:inset(100% 0 0 0)}
.pour .a{background:var(--celadon)}
.pour .b{background:var(--paper)}
body.leaving .pour .a{animation:pour .85s cubic-bezier(.7,0,.2,1) forwards}
body.leaving .pour .b{animation:pour .85s .22s cubic-bezier(.7,0,.2,1) forwards}
@keyframes pour{to{clip-path:inset(0 0 0 0)}}
body.leaving .ch{animation:lift .6s cubic-bezier(.6,0,.3,1) forwards;animation-delay:calc(var(--i) * 18ms)}
@keyframes lift{from{transform:none}to{transform:translateY(-110%)}}
body.leaving .desc,body.leaving .enter,body.leaving .top,body.leaving .bottom{transition:opacity .35s;opacity:0!important}

@media (prefers-reduced-motion: reduce){
  .ch{transform:none;animation:none}
  .desc,.enter{opacity:1;animation:none}
  .grain{animation:none}
  body.leaving .pour .a,body.leaving .pour .b{animation-duration:.01s}
}
@media (max-width:560px){
  .name .l2,.desc,.enter{padding-left:0;margin-left:0}
  .name{font-size:clamp(2.8rem,15vw,4.5rem)}
}
</style>
</head>
<body>
<main class="stage">
  <div class="glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="top">
    <span class="mono">Portfolio · 2026</span>
    <span class="mono">Syracuse, NY — Bangkok, TH</span>
  </div>

  <div class="center">
    <h1 class="name" aria-label="Thanida Boonkangvan"><span class="l1" aria-hidden="true">Thanida</span><span class="l2" aria-hidden="true">Boonkangvan</span></h1>
    <p class="desc"><span class="role">Brand Strategist &amp; Designer · PR</span>Design, storytelling and strategy for brands that connect with people.</p>
    <button class="enter" id="enter" type="button">Step inside <span class="arrow">→</span></button>
  </div>

  <div class="bottom">
    <span class="mono">Newhouse School · Syracuse University</span>
    <span class="mono links"><a href="http://www.linkedin.com/in/thanida-boonkangvan-74ba9a28b">LinkedIn</a><a href="mailto:thanidabkv@gmail.com">Email</a></span>
  </div>
</main>
<div class="pour" aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<script>
// Split the name into letters for the staggered rise
var n=0;
document.querySelectorAll('.name .l1, .name .l2').forEach(function(line){
  var t=line.textContent; line.textContent='';
  for(var c of t){var s=document.createElement('span');s.className='ch';s.style.setProperty('--i',n++);s.textContent=c;line.appendChild(s)}
});
// Glow follows the pointer, slowly
var glow=document.querySelector('.glow');
addEventListener('pointermove',function(e){glow.style.setProperty('--gx',e.clientX+'px');glow.style.setProperty('--gy',e.clientY+'px')});
// Enter: pour the glaze, then go to the portfolio
document.getElementById('enter').addEventListener('click',function(){
  if(document.body.classList.contains('leaving'))return;
  document.body.classList.add('leaving');
  try{sessionStorage.setItem('arrive','1')}catch(e){}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){location.href='portfolio.html'}, reduce?50:1150);
});
// Coming back with the browser's back button: reset
addEventListener('pageshow',function(e){if(e.persisted)document.body.classList.remove('leaving')});
</script>
</body>
</html>
